<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今の腸タイプ診断</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #f2a29c; /* コーラルピンク */
            --bg-color: #fdf6f5; /* 温かみのある背景色 */
            --text-color: #5c4d4d; /* 優しいこげ茶色 */
            --card-bg: #ffffff;
            --accent-color: #e87a70;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px; /* スマホ〜タブレットで見やすい幅 */
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .intro-text {
            font-size: 0.9rem;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            margin-bottom: 25px;
            text-align: center;
        }

        .question-group {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }

        .question-group h2 {
            font-size: 1.1rem;
            border-bottom: 2px dashed var(--primary-color);
            padding-bottom: 5px;
            margin-top: 0;
            color: var(--primary-color);
        }

        label {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        input[type="checkbox"] {
            margin-top: 5px;
            margin-right: 10px;
            accent-color: var(--primary-color);
            transform: scale(1.2);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Zen Maru Gothic', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(242, 162, 156, 0.4);
            transition: transform 0.2s;
            margin-top: 30px;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* 診断結果エリア */
        #result-area {
            display: none;
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            margin-top: 40px;
            border: 3px solid var(--primary-color);
        }

        #result-title {
            font-size: 1.6rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        #result-subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .result-content {
            font-size: 0.95rem;
            text-align: left;
            margin-bottom: 25px;
        }

        .result-content p {
            margin-bottom: 15px;
            background: #fdf6f5;
            padding: 15px;
            border-radius: 10px;
        }

        .result-content strong {
            color: var(--primary-color);
            display: block;
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .line-btn {
            display: inline-block;
            background-color: #06C755; /* LINEグリーン */
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(6, 199, 85, 0.3);
            margin-top: 10px;
            width: 80%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>親子の腸タイプがわかる！<br>「今の腸」タイプ診断</h1>
    </header>

    <div class="intro-text">
        直近1〜2週間の様子を思い浮かべて、当てはまるものにチェックをつけてください。<br>
        <span style="color:#e87a70; font-size:0.8rem;">※お子さんの場合は、大人が見て答えてあげてください。</span>
    </div>

    <form id="diagnosis-form">
        <div class="question-group">
            <h2>チェック 1</h2>
            <label><input type="checkbox" name="cat1"> 座っている/じっとしている時間が長い</label>
            <label><input type="checkbox" name="cat1"> 体を動かす量が少ない</label>
            <label><input type="checkbox" name="cat1"> 姿勢が崩れやすい(猫背・丸まる)</label>
            <label><input type="checkbox" name="cat1"> お腹に力が入りにくそう</label>
            <label><input type="checkbox" name="cat1"> 便が出るまでに時間がかかる</label>
        </div>

        <div class="question-group">
            <h2>チェック 2</h2>
            <label><input type="checkbox" name="cat2"> お腹やおへそ周りを触ると冷たい</label>
            <label><input type="checkbox" name="cat2"> 手足が冷えやすい</label>
            <label><input type="checkbox" name="cat2"> 冷たい飲み物・食べ物が多い</label>
            <label><input type="checkbox" name="cat2"> 朝なかなか動き出せない</label>
            <label><input type="checkbox" name="cat2"> 温かいもののあと表情や動きがゆるむ</label>
        </div>

        <div class="question-group">
            <h2>チェック 3</h2>
            <label><input type="checkbox" name="cat3"> 音・光・人混みのあとに疲れが出やすい</label>
            <label><input type="checkbox" name="cat3"> テンションが上がったあとに調子を崩しやすい</label>
            <label><input type="checkbox" name="cat3"> 寝つきが悪い/夜中に目が覚めやすい</label>
            <label><input type="checkbox" name="cat3"> 予定や環境が変わると不調が出やすい</label>
            <label><input type="checkbox" name="cat3"> 便の調子が日によって変わる</label>
        </div>

        <div class="question-group">
            <h2>チェック 4</h2>
            <label><input type="checkbox" name="cat4"> 外食・惣菜・加工食品が続くことがある</label>
            <label><input type="checkbox" name="cat4"> 味の濃いものをよく食べる</label>
            <label><input type="checkbox" name="cat4"> カロリーゼロ甘味料やプロテインなどをよく摂る</label>
            <label><input type="checkbox" name="cat4"> 夕方〜夜になると体が重そう / むくみやすい</label>
        </div>

        <div class="question-group">
            <h2>チェック 5</h2>
            <label><input type="checkbox" name="cat5"> お腹がゴロゴロ鳴りやすい / ガスやおならが多い</label>
            <label><input type="checkbox" name="cat5"> 甘いもの/パン・小麦製品が多い</label>
            <label><input type="checkbox" name="cat5"> 食後にお腹が張りやすい</label>
            <label><input type="checkbox" name="cat5"> 発酵食品のあと、逆に調子が悪いことがある</label>
        </div>

        <div class="question-group">
            <h2>チェック 6</h2>
            <label><input type="checkbox" name="cat6"> 2〜3日以上便が出ない / トイレを我慢しがち</label>
            <label><input type="checkbox" name="cat6"> 出てもスッキリしていない様子 / 便が硬そう</label>
            <label><input type="checkbox" name="cat6"> 休日と平日の起床時間がバラバラ</label>
            <label><input type="checkbox" name="cat6"> 出すのに時間がかかる / 朝に便意が起きにくい</label>
        </div>

        <button type="button" class="btn-submit" onclick="calculateResult()">診断結果を見る</button>
    </form>

    <div id="result-area">
        <p style="margin:0; font-size: 0.9rem; font-weight: bold; color: #5c4d4d;">あなたの腸タイプは…</p>
        <h2 id="result-title"></h2>
        <p id="result-subtitle"></p>
        
        <div id="result-desc" class="result-content"></div>
        
        <p style="font-size: 0.85rem; color: #666; margin-top: 30px;">
            腸は日々の体調や生活リズムで変わります。<br>何から整えたらいいか迷ったら、ひとりで抱え込まずに相談してくださいね！
        </p>
        <a href="https://lin.ee/slWwKp0" class="line-btn" target="_blank">LINEで詳しく質問してみる</a>
    </div>
</div>

<script>
    // 診断結果のデータ
    const resultsData = {
        cat1: {
            title: "ぽっこり・おさぼり腸",
            subtitle: "【 物理的刺激エラー型 】",
            desc: "<p><strong>あなたの状態：</strong>腸が重力で下がり、動きをサボっている状態です。「食物繊維が足りない」のではなく、「腸を揺らす物理的な刺激」が足りないのが原因です。</p><p><strong>💡 意外な事実：</strong>姿勢が悪いと内臓が下がり、腸が圧迫されて動きが鈍くなります。</p><p><strong>✅ 解決のヒント：</strong>まずは「背筋を伸ばして座る」こと。そして1日1回、親子で一緒にゴロンと転がったり、背伸びをして腸に「動くきっかけ」を与えてあげましょう。</p>"
        },
        cat2: {
            title: "ひえひえ・冬眠腸",
            subtitle: "【 温度と菌の働きエラー型 】",
            desc: "<p><strong>あなたの状態：</strong>お腹が冷えることで、腸内細菌が“冬眠状態”になり活動を停止している状態です。</p><p><strong>💡 意外な事実：</strong>腸内細菌が活発に働くには「最適な温度」が必要です。冷たい飲み物は菌の働きを麻痺させてしまいます。</p><p><strong>✅ 解決のヒント：</strong>飲み物は常温か温かいものを選ぶこと。朝や夜に、手や湯たんぽでお腹を直接温めて、菌が目覚める環境を作ってあげましょう。</p>"
        },
        cat3: {
            title: "カチコチ・がんばり腸",
            subtitle: "【 自律神経・脳腸相関エラー型 】",
            desc: "<p><strong>あなたの状態：</strong>「腸」が悪いのではなく、「脳や神経の緊張」が腸の動きをピタッと止めてしまっている状態です。</p><p><strong>💡 意外な事実：</strong>脳と腸は自律神経で直結しています（脳腸相関）。行事などでテンションが上がった後にお腹がゆるむのは、この神経が過敏に反応しているからです。</p><p><strong>✅ 解決のヒント：</strong>「もっと腸活しなきゃ」と新しい食材を試すより、まずは安心させることが最優先。夜は照明を落とし、お腹や背中に優しく触れる時間を作って刺激を減らしましょう。</p>"
        },
        cat4: {
            title: "パンパン・すれちがい腸",
            subtitle: "【 消化とエサ選びエラー型 】",
            desc: "<p><strong>あなたの状態：</strong>タンパク質が未消化のまま腸に届いて腐敗したり、善玉菌の「エサ」が枯渇している状態。栄養は摂れていても、腸内細菌と「すれ違い」が起きています。</p><p><strong>💡 意外な事実：</strong>良かれと思ったカロリーゼロ甘味料は、血糖値は上げませんが善玉菌のエサにもなりません。また、未消化のタンパク質はお腹の張りの原因になります。</p><p><strong>✅ 解決のヒント：</strong>善玉菌を育てるなら「てんさい糖」などオリゴ糖を含むものを少し取り入れること。 Shelton食、または1食だけ「ごはん＋汁物」のシンプルな食事にし、腸の消化と吸収をお休みさせてあげましょう。</p>"
        },
        cat5: {
            title: "プクプク・過発酵腸",
            subtitle: "【 隠れ過発酵・SIBOリスク型 】",
            desc: "<p><strong>あなたの状態：</strong>良かれと思って食べている腸活食材が、小腸内で異常に発酵し、ガスを大量発生させている「発酵しすぎ」の状態です。</p><p><strong>💡 意外な事実：</strong>「便秘＝とにかく発酵食品」は全員に当てはまりません。特定の糖質や菌が腸内で悪さをし、逆にお腹を張らせることがあります。</p><p><strong>✅ 解決のヒント：</strong>まずは発酵食品を一度お休みしてみましょう。食物繊維を摂るなら、腸内でガスを発生させにくい「水溶性食物繊維（海藻やきのこ類）」にシフトし、腸内を落ち着かせるのが先決です。</p>"
        },
        cat6: {
            title: "時差ボケ・溜まり腸",
            subtitle: "【 体内時計とリズムエラー型 】",
            desc: "<p><strong>あなたの状態：</strong>生活リズムの乱れから、腸が「時差ボケ」を起こして排便のタイミングを見失っている状態です。</p><p><strong>💡 意外な事実：</strong>「何を食べるか」より「いつ食べるか」。腸内細菌にも独自の『体内時計』があり、食事や起きる時間がズレると腸はぜんどう運動をサボり始めます。</p><p><strong>✅ 解決のヒント：</strong>朝の光を浴びて、朝食（または常温の水）を胃腸に入れることで腸の時計をリセットしましょう。「出さなきゃ」と焦らせず、毎日同じ時間にトイレに座るだけの空気作りが大切です。</p>"
        }
    };

    function calculateResult() {
        // 各カテゴリのチェック数をカウント
        const counts = {
            cat1: document.querySelectorAll('input[name="cat1"]:checked').length,
            cat2: document.querySelectorAll('input[name="cat2"]:checked').length,
            cat3: document.querySelectorAll('input[name="cat3"]:checked').length,
            cat4: document.querySelectorAll('input[name="cat4"]:checked').length,
            cat5: document.querySelectorAll('input[name="cat5"]:checked').length,
            cat6: document.querySelectorAll('input[name="cat6"]:checked').length
        };

        // 一番チェックが多いカテゴリを見つける
        let maxCategory = 'cat1';
        let maxCount = -1;
        let totalChecked = 0;

        for (const cat in counts) {
            totalChecked += counts[cat];
            if (counts[cat] > maxCount) {
                maxCount = counts[cat];
                maxCategory = cat;
            }
        }

        // 1つもチェックがない場合の処理
        if (totalChecked === 0) {
            alert("項目にチェックを入れてください。");
            return;
        }

        // 結果を画面に表示
        document.getElementById('result-title').innerHTML = resultsData[maxCategory].title;
        document.getElementById('result-subtitle').innerHTML = resultsData[maxCategory].subtitle;
        document.getElementById('result-desc').innerHTML = resultsData[maxCategory].desc;
        
        // 結果エリアをアニメーション付きで表示
        const resultArea = document.getElementById('result-area');
        resultArea.style.display = 'block';
        
        // スムーズに結果エリアまでスクロール
        resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
</script>

</body>
</html>
